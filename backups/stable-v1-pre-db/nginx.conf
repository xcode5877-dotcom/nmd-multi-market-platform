# nmd.marketing — Production: HTTP redirect + HTTPS with SSL, /api → mock-api:5190
# Included as /etc/nginx/conf.d/default.conf (inside the image's existing http {}).
# Do NOT add an outer http {} here — it would cause a syntax error.
# MIME types: at very top of server block; no add_header Content-Type in assets or parent so mime.types wins.

# Port 80: redirect all traffic to https://nmd.marketing
server {
    listen 80;
    server_name nmd.marketing;

    # Let's Encrypt HTTP-01 challenge (Certbot webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location /health {
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # Redirect all other HTTP to HTTPS
    location / {
        return 301 https://nmd.marketing$request_uri;
    }
}

# Port 443: main site + API proxy with SSL
server {
    listen 443 ssl;
    server_name nmd.marketing;

    # MIME types first (no manual Content-Type in assets blocks – avoids duplicate/override).
    include /etc/nginx/mime.types;

    # Single root for the whole server; sub-paths managed by location + try_files only
    root /usr/share/nginx/html;
    index index.html;

    # SSL certificates (host volume: /etc/letsencrypt)
    ssl_certificate     /etc/letsencrypt/live/nmd.marketing/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nmd.marketing/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    # Diagnostic: confirm nginx is reaching this config (remove in production if desired)
    location /test-me {
        return 200 'Nginx is reaching this block';
        add_header Content-Type text/plain;
    }

    location /health {
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # API (includes /api/uploads/) → mock-api:5190 (fixes mixed content; serve images over HTTPS)
    location /api/ {
        proxy_pass http://mock-api:5190/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # Sub-path SPAs: global root; try_files serves real files first, then index.html for SPA routes.

    # Courier app (base /courier/)
    location /courier/ {
        try_files $uri $uri/ /courier/index.html;
        add_header Cache-Control "no-cache";
    }

    # Assets: if file missing → hard 404 (no fallback to index.html; browser won't parse HTML as JS).
    # Cache busting: no-store so dev always gets fresh assets (remove or relax in production).
    location ^~ /market-admin/assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location ^~ /merchant/assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Admin dashboard – SPA fallback to index.html (only for non-asset paths).
    location /market-admin/ {
        try_files $uri $uri/ /market-admin/index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location /merchant/ {
        try_files $uri $uri/ /merchant/index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Storefront at root
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
