# nmd.marketing — Production: web-gateway (Nginx + 4 frontends) + mock-api
# HTTPS: mount /etc/letsencrypt from host. Preserve data: ./data/data.json for mock-api.

services:
  web-gateway:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_PUBLIC_ORIGIN: "https://nmd.marketing"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # SSL certificates from host (Certbot)
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Webroot for Certbot HTTP-01 renewal
      - /var/www/certbot:/var/www/certbot
    depends_on:
      - mock-api
    restart: unless-stopped

  mock-api:
    build:
      context: .
      dockerfile: Dockerfile.mock-api
    ports:
      - "5190:5190"
    environment:
      PORT: "5190"
      STORAGE_DRIVER: "json"
      DATA_FILE: "/data/data.json"
      PUBLIC_URL: "https://nmd.marketing/api"
    volumes:
      - ./data:/data
    restart: unless-stopped
