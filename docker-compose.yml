# nmd.marketing — Production: web-gateway (Nginx + 4 frontends) + mock-api
#
# DATA PERSISTENCE (no data loss on down/up, rebuild, or image uploads):
# - PostgreSQL: named volume "postgres_data". Markets, tenants, orders, and all DB-backed data persist.
# - mock-api data (data.json, orders.json, market-config.json, push-subscriptions): named volume
#   "mock_api_data" at /app/data so host builds/restarts never wipe them.
# - Uploads: named volume "uploads_data" at /app/uploads so saving images does NOT trigger host
#   filesystem changes that could refresh the container or affect DB connectivity.
# - STORAGE_DRIVER is hardcoded to "db" so the app never reverts to json (empty) mode.
#
# First time after switching to named volumes: mock_api_data and uploads_data start empty. The
# entrypoint creates data.json, orders.json, etc. in mock_api_data. If you had host files you need
# (e.g. market-config.json, uploads), copy once: docker cp ./apps/mock-api/market-config.json
# nmd-multi-market-platform-mock-api-1:/app/data/ ; docker cp ./apps/mock-api/uploads/. nmd-multi-market-platform-mock-api-1:/app/uploads/

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nmd
      POSTGRES_PASSWORD: nmd
      POSTGRES_DB: nmd
    volumes:
      # Persistent volume: survives docker compose down/up and rebuild. For host-visible data use: ./postgres_data:/var/lib/postgresql/data
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nmd -d nmd"]
      interval: 5s
      timeout: 5s
      retries: 5

  web-gateway:
    build:
      # Context must be repo root so Dockerfile.web can COPY packages and apps
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_PUBLIC_ORIGIN: "https://nmd.marketing"
        # Force fresh storefront build (set to "1" or $(date +%s) when deploying cart/checkout UI updates)
        STOREFRONT_CACHEBUST: "1"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # SSL certificates from host (Certbot)
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Webroot for Certbot HTTP-01 renewal
      - /var/www/certbot:/var/www/certbot
    depends_on:
      - mock-api
    restart: unless-stopped

  whatsapp-service:
    build:
      context: apps/whatsapp-service
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    shm_size: '2gb'
    privileged: true
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_ADMIN
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      PORT: "3000"
      WA_SESSION_PATH: "/app/session"
      PUPPETEER_EXECUTABLE_PATH: "/usr/bin/google-chrome-stable"
      WA_API_KEY: "your_secret_key_here"
      DEBUG: "whatsapp-web.js:*" # لتفعيل سجلات إضافية من المكتبة نفسها
      DATABASE_URL: "postgresql://nmd:nmd@postgres:5432/nmd?schema=public"
    volumes:
      - whatsapp_session:/app/session
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G
    restart: unless-stopped

  mock-api:
    build:
      context: .
      dockerfile: Dockerfile.mock-api
      args:
        PRISMA_REBUILD: "postgresql"
    ports:
      # External port 3001 (host) → container port 5190 (API runs on 5190 inside container)
      - "3001:5190"
    # Entrypoint: chmod /app/uploads for real-time sync, then run app (set CMD to skip migrate: node dist/index.js)
    entrypoint: ["/app/apps/mock-api/docker-entrypoint.sh"]
    command: ["node", "/app/apps/mock-api/dist/index.js"]
    environment:
      PORT: "5190"
      # Hardcoded db: always use PostgreSQL. Never revert to json (which would show empty markets/stores).
      STORAGE_DRIVER: "db"
      DATA_FILE: "/app/data/data.json"
      MARKET_CONFIG_FILE: "/app/data/market-config.json"
      ORDERS_FILE: "/app/data/orders.json"
      UPLOADS_DIR: "/app/uploads"
      # Use service name "postgres" and internal port 5432; schema=public for Prisma
      DATABASE_URL: "postgresql://nmd:nmd@postgres:5432/nmd?schema=public"
      PUBLIC_URL: "https://nmd.marketing/api"
      # WhatsApp gateway: mock-api sends OTP via this URL (x-api-key required)
      WHATSAPP_GATEWAY_URL: "http://whatsapp-service:3000"
      WA_API_KEY: "${WA_API_KEY:-your_secret_key_here}"
      # Firebase Admin (FCM). Path inside container: /app/firebase-service-account.json. Must match the app's Firebase project (e.g. now-market-59841).
      FIREBASE_SERVICE_ACCOUNT_PATH: "/app/firebase-service-account.json"
    volumes:
      # Named volume: survives build/restart and is isolated from host. Saves to uploads no longer
      # trigger host filesystem changes that could affect the container or DB connection.
      - uploads_data:/app/uploads
      # Named volume for JSON config (market-config, push-subscriptions, etc.). With STORAGE_DRIVER=db
      # markets/tenants come from Postgres; this volume keeps layout and other file-backed state.
      - mock_api_data:/app/data
      # Firebase Admin (FCM). Service account file kept with its original name; mounted at /app/firebase-service-account.json in container. If you had a directory at apps/mock-api/firebase-service-account.json, remove it to avoid EISDIR.
      - ./apps/mock-api/now-market-59841-firebase-adminsdk-fbsvc-949643eb84.json:/app/firebase-service-account.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  # PostgreSQL data; survives down/up and rebuild. Required for STORAGE_DRIVER=db — do not remove unless intentionally resetting DB.
  postgres_data:
  # Mock-api JSON files (data.json, orders.json, market-config.json, push-subscriptions.json). Survives build/restart.
  mock_api_data:
  # Uploads (logos, banners, product images). Separate from data so image saves never trigger filesystem refresh that wipes DB view.
  uploads_data:
  # WhatsApp session; survives restarts so QR code is not required again
  whatsapp_session:
