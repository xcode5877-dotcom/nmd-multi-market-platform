# Monorepo root: this file must live next to package.json / pnpm-workspace.yaml.
# Build `context: .` is the directory containing THIS compose file (the repo root), not your shell cwd.
#
# Build contexts (one per image — no shared ambiguous paths):
#   web-gateway, mock-api  → context: .  (repo root; Dockerfiles COPY root package.json / workspace)
#   whatsapp-service       → context: ./apps/whatsapp-service
#   soundmir-app           → context: ./apps/soundmir-app (Soundmir app’s own package.json there)
# Wrong: docker build -f Dockerfile.mock-api apps/mock-api  (no root package.json in context)
# Right: docker compose build mock-api   OR   docker build -f Dockerfile.mock-api .
#          from the repository root (same folder as this file).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nmd
      POSTGRES_PASSWORD: nmd
      POSTGRES_DB: nmd
    networks:
      - nmd_net
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nmd -d nmd"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  # mock-api + web-gateway: build.context MUST stay "." (repo root) — Dockerfiles COPY package.json from there.
  # --- Public HTTP/HTTPS: ONLY this service publishes host :80 and :443 (see ports below). ---
  # nmd.marketing / www + soundmir.com / www are terminated INSIDE web-gateway (nginx-10-*.conf, nginx-30-*.conf
  # in the image). soundmir-app has no host port mapping; it is reached only via proxy_pass from web-gateway.
  #
  # If `docker compose up` fails with "address already in use" on 80/443, the host OS (e.g. system nginx) is
  # still bound to those ports. Free them so Compose remains the sole owner, then start again, e.g.:
  #   sudo systemctl disable --now nginx
  #   # or: sudo systemctl stop apache2
  # Do not publish :80/:443 from any other compose service or duplicate reverse-proxy on this host.
  web-gateway:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_PUBLIC_ORIGIN: "https://nmd.marketing"
        STOREFRONT_CACHEBUST: "1"
    networks:
      - nmd_net
    ports:
      - "80:80"
      - "443:443"
      # Alternate HTTP port (e.g. direct IP tests); Host header still selects vhost — catch-all is default_server only on :80/:41532 inside container
      - "41532:80"
    volumes:
      # Host Certbot writes certs + webroot challenges; Nginx reads both. Paths must match certbot -w /var/www/certbot.
      # Prep: mkdir -p /var/www/certbot/.well-known/acme-challenge && chmod -R 755 /var/www/certbot
      # :rw on letsencrypt so deploy hooks / renewal can refresh symlinks; Nginx only needs read for serving.
      - /etc/letsencrypt:/etc/letsencrypt:rw
      - /var/www/certbot:/var/www/certbot:rw
      - /opt/qashtota/frontend/dist:/opt/qashtota/frontend/dist:ro
    depends_on:
      - mock-api
      # WhatsApp is optional for the gateway; nginx → mock-api handles /api/*. Do not tie gateway boot to whatsapp-service.
    # Restart after host reboot; will bind :80/:443 as soon as they are free (no competing host nginx).
    restart: always

  whatsapp-service:
    build:
      context: apps/whatsapp-service
      dockerfile: Dockerfile
    networks:
      - nmd_net
    ports:
      - "3000:3000"
    shm_size: '2gb'
    privileged: true
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_ADMIN
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      PORT: "3000"
      WA_SESSION_PATH: "/app/session"
      PUPPETEER_EXECUTABLE_PATH: "/usr/bin/google-chrome-stable"
      WA_API_KEY: "${WA_API_KEY:-your_secret_key_here}"
      DEBUG: "whatsapp-web.js:*"
      DATABASE_URL: "postgresql://nmd:nmd@postgres:5432/nmd?schema=public"
    volumes:
      - whatsapp_session:/app/session
    healthcheck:
      test:
        - "CMD-SHELL"
        - "node -e \"fetch('http://localhost:3000/health',{headers:{'x-api-key':process.env.WA_API_KEY}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G
    restart: always

  mock-api:
    build:
      context: .
      dockerfile: Dockerfile.mock-api
    # Must share nmd_net with web-gateway (service name must stay `mock-api` — matches $upstream_mock_api in Nginx).
    networks:
      - nmd_net
    ports:
      - "3001:5190"
    entrypoint: ["/app/apps/mock-api/docker-entrypoint.sh"]
    command: ["node", "/app/apps/mock-api/dist/index.js"]
    environment:
      PORT: "5190"
      # Must match volume uploads_data:/app/uploads — static /uploads and multer use this path.
      UPLOADS_DIR: "/app/uploads"
      STORAGE_DRIVER: "db"
      DATA_FILE: "/app/data/data.json"
      DATABASE_URL: "postgresql://nmd:nmd@postgres:5432/nmd?schema=public"
      PUBLIC_URL: "https://nmd.marketing/api"
      USE_LEGACY_WHATSAPP_GATEWAY: "1"
      WHATSAPP_GATEWAY_URL: "http://whatsapp-service:3000"
      WA_API_KEY: "${WA_API_KEY:-your_secret_key_here}"
      FIREBASE_SERVICE_ACCOUNT_PATH: "/app/firebase-service-account.json"
      API_KEY: "c522d724baaaf9a3213dcf17590f0fd8"
      # Platform service fee — customer-visible repricing (Phase 1). Rollback: set false and redeploy mock-api.
      PLATFORM_FEE_ENABLED: "true"
    volumes:
      - uploads_data:/app/uploads
      - mock_api_data:/app/data
      - ./apps/mock-api/now-market-59841-firebase-adminsdk-fbsvc-949643eb84.json:/app/firebase-service-account.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      # Do NOT gate mock-api on whatsapp-service health: if WA is stuck (QR/session), the whole API would never listen → nginx 502 on all /api/* (stores, markets, auth).
      # OTP/WhatsApp routes fail gracefully at runtime; DB-backed reads keep working once postgres is healthy.
    restart: always

  # Backend only — no host :80/:443; TLS and Host routing: web-gateway → soundmir-app:3000.
  # Build context is apps/soundmir-app (must contain package.json — see apps/soundmir-app/INTEGRATION.txt).
  soundmir-app:
    container_name: soundmir-app
    build:
      context: ./apps/soundmir-app
      dockerfile: Dockerfile
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      STORE_PATH: /app/data/store.json
      NEXT_PUBLIC_SITE_URL: https://soundmir.com
      ADMIN_PASSWORD: soundmir2026
    volumes:
      - ./apps/soundmir-app/data:/app/data
    networks:
      - nmd_net

volumes:
  postgres_data:
  mock_api_data:
  uploads_data:
  whatsapp_session:

networks:
  nmd_net:
