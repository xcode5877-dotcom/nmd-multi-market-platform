publish_to: "none"
version: 0.1.1+2

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.9.0
  sunmi_printer_plus: ^4.1.0
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.1.0
  flutter_barcode_listener: ^0.1.4
