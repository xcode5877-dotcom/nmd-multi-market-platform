name: customer_flutter
description: Now Market customer app (Flutter)
publish_to: "none"
version: 1.0.8+24

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.9.0
  flutter_bloc: ^9.1.1
  provider: ^6.1.2
  go_router: ^14.8.1
  equatable: ^2.0.7
  collection: ^1.19.0
  google_fonts: ^6.3.1
  flutter_secure_storage: ^9.2.4
  carousel_slider: ^5.1.1
  flutter_svg: ^2.2.0
  cached_network_image: ^3.4.1
  scrollable_positioned_list: ^0.3.8
  http: ^1.2.2
  shimmer: ^3.0.0
  url_launcher: ^6.3.1
  lottie: ^3.3.2
  flutter_staggered_animations: ^1.1.1
  pinput: ^6.0.2
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  webview_flutter: ^4.10.0
  flutter_native_splash: ^2.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/animations/
    - assets/lottie/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/nowmarket_icon_1024.png"
  adaptive_icon_background: "#0F6F6B"
  adaptive_icon_foreground: "assets/branding/nowmarket_foreground_1024.png"
  adaptive_icon_monochrome: "assets/branding/nowmarket_foreground_1024.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#0F6F6B"
  image: assets/branding/splash_logo_white.png
  background_image: assets/branding/splash_local_grid_bg.png
  android: true
  ios: true
  web: false
  android_gravity: center
  ios_content_mode: center
  android_12:
    color: "#0F6F6B"
    image: assets/branding/splash_logo_white.png
