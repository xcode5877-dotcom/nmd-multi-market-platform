<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#00A0A0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Now Admin" />
    <link rel="manifest" href="/merchant/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/merchant/favicon.svg" />
    <link rel="apple-touch-icon" href="/merchant/icons/icon-192x192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Now Admin</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        var key = 'nmd-chunk-reload';
        if (sessionStorage.getItem(key)) return;
        function maybeReload(msg) {
          var s = (msg || '') + '';
          if (s.indexOf('fetch dynamically imported module') === -1 && s.indexOf('Importing a module script failed') === -1 && s.indexOf('Loading chunk') === -1) return;
          sessionStorage.setItem(key, '1');
          window.location.reload();
        }
        window.addEventListener('error', function (e) { maybeReload(e && e.message); });
        window.addEventListener('unhandledrejection', function (e) { maybeReload(e.reason && e.reason.message); });
        window.addEventListener('vite:preloadError', function () { window.location.reload(); });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
