<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#00A0A0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NOW Market" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>NOW Market - Daburiyya</title>
  </head>
  <body>
    <div id="splash" aria-hidden="true" style="position:fixed;inset:0;background:#00A0A0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity 0.3s ease;">
      <div style="width:80px;height:80px;border-radius:16px;background:rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;margin-bottom:16px;">
        <img src="/favicon.svg" alt="" width="64" height="64" style="border-radius:12px;" />
      </div>
      <p style="color:rgba(255,255,255,0.9);font-size:1rem;font-weight:600;margin:0;">NOW Market</p>
    </div>
    <div id="root"></div>
    <script>window.nmdHideSplash=function(){var s=document.getElementById('splash');if(s){s.style.opacity='0';setTimeout(function(){s.style.display='none';},300);}};setTimeout(window.nmdHideSplash,4000);</script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
