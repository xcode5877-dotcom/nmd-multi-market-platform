# nmd.marketing — Port 80 serves web + API (no redirect); Port 443 same with SSL. /api → mock-api:5190
# Included as /etc/nginx/conf.d/default.conf (inside the image's existing http {}).
# Do NOT add an outer http {} here — it would cause a syntax error.
# MIME types: at very top of server block; no add_header Content-Type in assets or parent so mime.types wins.
# Port 80 default_server allows direct IP (e.g. http://144.126.213.141) for app testing without HTTPS redirect.
# Storefront: root / serves built SPA from /usr/share/nginx/html (Dockerfile.web must build storefront into image; do not use default nginx index).

server {
    listen 80 default_server;
    listen 443 ssl;
    server_name nmd.marketing 144.126.213.141;

    # Let's Encrypt HTTP-01 challenge (Certbot webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # MIME types first (no manual Content-Type in assets blocks – avoids duplicate/override).
    include /etc/nginx/mime.types;

    # Single root for the whole server; sub-paths managed by location + try_files only
    root /usr/share/nginx/html;
    index index.html;

    # SSL certificates (host volume: /etc/letsencrypt)
    ssl_certificate     /etc/letsencrypt/live/nmd.marketing/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nmd.marketing/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    # Diagnostic: confirm nginx is reaching this config (remove in production if desired)
    location /test-me {
        return 200 'Nginx is reaching this block';
        add_header Content-Type text/plain;
    }

    location /health {
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # Uploads: proxy to mock-api (files live in container volume uploads_data at /app/uploads). No cache so new banners appear immediately.
    location /api/uploads/ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        client_max_body_size 50M;
        proxy_pass http://mock-api:5190/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin notifications (broadcast, send-to-customer) → mock-api:5190
    location /api/admin/notifications/ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        client_max_body_size 50M;
        proxy_pass http://mock-api:5190/admin/notifications/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # API (all /api/* including /api/internal/test-fcm, /api/coupons, /api/customer/rewards) → mock-api:5190 (prefix stripped; backend sees /internal/test-fcm)
    location /api/ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        client_max_body_size 50M;
        proxy_pass http://mock-api:5190/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # Sub-path SPAs: global root; try_files serves real files first, then index.html for SPA routes.

    # Courier/Driver: exact /courier and /driver (no trailing slash) → redirect to /courier/
    location = /courier {
        return 301 $scheme://$host/courier/;
    }
    location = /driver {
        return 301 $scheme://$host/courier/;
    }
    location /driver/ {
        return 301 $scheme://$host/courier/;
    }

    # Courier app (base /courier/) – SPA fallback
    location /courier/ {
        try_files $uri $uri/ /courier/index.html;
        add_header Cache-Control "no-cache";
    }

    # Courier assets: hard 404 if file missing (no fallback to index.html)
    location ^~ /courier/assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Admin app: MUST be isolated from root so /market-admin is never treated as a store slug.
    # Exact /market-admin (no trailing slash) → redirect to /market-admin/
    location = /market-admin {
        return 301 $scheme://$host/market-admin/;
    }
    # Admin assets: serve files only (no SPA fallback)
    location ^~ /market-admin/assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
    # Admin dashboard: ^~ stops search so this block alone serves all /market-admin/* (never passes to root/storefront).
    location ^~ /market-admin/ {
        try_files $uri $uri/ /market-admin/index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Merchant: exact /merchant (no slash) → redirect so relative script paths (./assets/...) resolve from /merchant/
    location = /merchant {
        return 301 $scheme://$host/merchant/;
    }
    # Merchant assets (JS/CSS) — physical path: html/merchant/assets/
    location ^~ /merchant/assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
    # Merchant SPA: serve index.html from html/merchant/; fallback for client-side routes. No-cache so index.html always points to latest JS chunks after deploy.
    location /merchant/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /merchant/index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Service Worker at root scope (iOS needs scope: '/' for push; admin app uses /merchant/ subpath)
    location = /sw.js {
        alias /usr/share/nginx/html/merchant/sw.js;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }

    # Privacy Policy: static file at root — do not hand to SPA
    location = /privacy.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=3600";
    }

    # Storefront root-level assets (JS/CSS) — serve files only, no SPA fallback
    location ^~ /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000";
    }

    # Storefront for nmd.marketing: root / serves the built storefront SPA (index.html + assets). No fallback to default nginx page.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
